<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="numberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7fafc;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Круглый фон с градиентом -->
  <circle cx="32" cy="32" r="32" fill="url(#bgGradient)"/>
  
  <!-- Большая цифра "5" -->
  <text x="32" y="48" 
        text-anchor="middle" 
        font-family="Arial, sans-serif" 
        font-size="36" 
        font-weight="bold" 
        fill="url(#numberGradient)"
        filter="url(#glow)">5</text>
  
  <!-- Маленькие декоративные точки внизу -->
  <circle cx="20" cy="52" r="2" fill="rgba(255,255,255,0.6)"/>
  <circle cx="26" cy="54" r="1.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="38" cy="54" r="1.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="44" cy="52" r="2" fill="rgba(255,255,255,0.6)"/>
</svg> 